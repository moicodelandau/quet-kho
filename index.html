  <script>
/* Logic tra cuu barcode -> san pham.
 * Tach rieng khoi app.js de test duoc bang web/test-quet.html
 * (test chay dung ham nay, khong phai ban sao chep).
 */
"use strict";

var QK = (function () {

  /** Chuan hoa de SO SANH: hoa, bo khoang trang / - _ . */
  function norm(s) {
    return String(s || "").toUpperCase().replace(/[\s\-_.]/g, "");
  }

  /* Du lieu goc cua cong ty co ~130 dong bi go nham mo ta vao o ma vach:
   * "DAN NONGMCD28CRN1". Bo tien to nay ra thi phan con lai chinh la ma model,
   * nho vay quet ma model tren thung van nhan ra. */
  var GLUE_RE = /^DAN\s*(?:NONG|LANH)\s*/i;
  function stripGlue(s) {
    return String(s || "").replace(GLUE_RE, "");
  }

  /* --- EAN-13 <-> UPC-A ---------------------------------------------------
   * Cung 1 tem, may quet nay tra 12 so, may khac tra 13 so co so 0 dau.
   * Quy ve 1 dang de khong bi coi la "ma la". */
  function upcVariants(n) {
    var out = [];
    if (/^\d{13}$/.test(n) && n.charAt(0) === "0") out.push(n.slice(1));
    if (/^\d{12}$/.test(n)) out.push("0" + n);
    return out;
  }

  /** Dung index tra cuu tu danh sach mapping. */
  function buildIndexes(rows) {
    var idxBarcode = {}, idxMaHang = {};
    (rows || []).forEach(function (r) {
      var b = norm(r.barcode);
      if (b) {
        if (!idxBarcode[b]) idxBarcode[b] = r;
        // ma vach bi dinh chu mo ta -> index them ban da bo tien to
        var g = norm(stripGlue(r.barcode));
        if (g && g !== b && !idxBarcode[g]) idxBarcode[g] = r;
        upcVariants(b).forEach(function (v) { if (!idxBarcode[v]) idxBarcode[v] = r; });
      }
      // 1 ma_hang co the nhieu barcode — giu row dau tien la du de hien ten/loai
      var m = norm(r.ma_hang);
      if (m && !idxMaHang[m]) idxMaHang[m] = r;
      var gm = norm(stripGlue(r.ma_hang));
      if (gm && gm !== m && !idxMaHang[gm]) idxMaHang[gm] = r;
    });
    return { idxBarcode: idxBarcode, idxMaHang: idxMaHang };
  }

  /**
   * Tra cuu 1 ma vua quet. Tra ve row mapping hoac null (= MA LA).
   * Khong bao gio doan mo (fuzzy) — doan sai con te hon bat nguoi dung gan tay.
   */
  function lookup(rawCode, idx) {
    var input = String(rawCode == null ? "" : rawCode).trim().toUpperCase();
    if (!input) return null;
    var n = norm(input);
    if (!n) return null;

    // 1+2. theo ma vach (ban goc / ban chuan hoa)
    var row = idx.idxBarcode[n];
    if (row) return row;

    // 3. theo ma hang (thung in thang model code)
    row = idx.idxMaHang[n];
    if (row) return row;

    // 4. ma vach 12 so <-> 13 so (UPC-A / EAN-13)
    var vars = upcVariants(n);
    for (var i = 0; i < vars.length; i++) {
      row = idx.idxBarcode[vars[i]] || idx.idxMaHang[vars[i]];
      if (row) return row;
    }

    // 5. bo tien to mo ta neu may quet doc trung o bi go nham
    var g = norm(stripGlue(input));
    if (g && g !== n) {
      row = idx.idxBarcode[g] || idx.idxMaHang[g];
      if (row) return row;
    }

    // 6. quy uoc AUX: A... = dan nong, AW... = dan lanh cua cung model
    if (/^AW/.test(n)) {
      var asDN = "A" + n.slice(2);
      row = idx.idxBarcode[asDN] || idx.idxMaHang[asDN];
      if (row) {
        return {
          barcode: input, ma_hang: row.ma_hang,
          ten_hang: String(row.ten_hang).replace(/DAN NONG/i, "DAN LANH"),
          loai: "DL", hang_sx: row.hang_sx
        };
      }
    } else if (/^A(?!W)/.test(n)) {
      var asDL = "AW" + n.slice(1);
      row = idx.idxBarcode[asDL] || idx.idxMaHang[asDL];
      if (row) {
        return {
          barcode: input, ma_hang: row.ma_hang,
          ten_hang: String(row.ten_hang).replace(/DAN LANH/i, "DAN NONG"),
          loai: "DN", hang_sx: row.hang_sx
        };
      }
    }

    return null; // MA LA — de nguoi dung gan tay 1 lan roi hoc
  }

  /* --- HANG SAN XUAT ------------------------------------------------------
   * Cot hang_sx trong du lieu goc bi lem: viet tat (PANA, MITSU), bo trong,
   * hoac dinh nham chu khac. Nen doan lai tu ten_hang theo danh sach hang co
   * that -> man hinh "chon hang" sach se, giong may kiem hang cu.
   */
  var BRANDS = [
    "DAIKIN", "PANASONIC", "MITSUBISHI", "TOSHIBA", "SAMSUNG", "CASPER",
    "FUNIKI", "REETECH", "SUMIKURA", "NAGAKAWA", "MIDEA", "GREE", "COMFEE",
    "AQUA", "SHARP", "ELECTROLUX", "HISENSE", "HITACHI", "AIRWELL", "HIKAWA",
    "FUJITSU", "ASANZO", "SANAKY", "COOCAA", "FFALCON", "KANGAROO", "SUNHOUSE",
    "ALASKA", "DARLING", "BEKO", "WHIRLPOOL", "CARRIER", "TRANE", "AUX", "TCL", "LG",
    // ngoai may lanh: binh nuoc nong, tivi... cung nam trong kho
    "ARISTON", "FERROLI", "ROSSI", "PICENZA", "RINNAI", "KORIHOME", "SONY"
  ];

  /* Viet tat / go sai thuong gap trong cot hang_sx -> ten hang chuan */
  var BRAND_ALIAS = {
    PANA: "PANASONIC", MITSU: "MITSUBISHI", MITSHUBISHI: "MITSUBISHI",
    MISUBISHI: "MITSUBISHI", MISHUBISHI: "MITSUBISHI", MITSUBISHIHEAVY: "MITSUBISHI",
    REE: "REETECH", NAGA: "NAGAKAWA", FUNIKIN: "FUNIKI", SUMI: "SUMIKURA",
    ELEC: "ELECTROLUX", DAIKIN: "DAIKIN"
  };

  var KHAC = "KHÁC";

  function esc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  /** Hang cua 1 dong mapping: uu tien hang_sx, khong ro thi doc trong ten_hang. */
  function brandOf(row) {
    var hs = norm(row && row.hang_sx);
    if (hs) {
      var a = BRAND_ALIAS[hs] || hs;
      for (var i = 0; i < BRANDS.length; i++) {
        if (norm(BRANDS[i]) === a) return BRANDS[i];
      }
    }
    // \b de tranh an nham: "LG" khong duoc khop trong "ALGO..."
    var t = String((row && row.ten_hang) || "").toUpperCase();
    for (var j = 0; j < BRANDS.length; j++) {
      if (new RegExp("\\b" + esc(BRANDS[j]) + "\\b").test(t)) return BRANDS[j];
    }
    return KHAC;
  }

  /** Danh sach hang + so model, nhieu model xep truoc. KHAC luon xuong cuoi. */
  function brandList(rows) {
    var c = {};
    (rows || []).forEach(function (r) {
      var k = norm(r.ma_hang);
      if (!k) return;
      var b = brandOf(r);
      if (!c[b]) c[b] = {};
      c[b][k] = 1;
    });
    return Object.keys(c).map(function (b) {
      return { hang: b, count: Object.keys(c[b]).length };
    }).sort(function (a, b) {
      if (a.hang === KHAC) return 1;
      if (b.hang === KHAC) return -1;
      return b.count - a.count;
    });
  }

  /** Cac model (duy nhat theo ma_hang) cua 1 hang, xep theo ma. */
  function modelsOfBrand(rows, brand) {
    var seen = {}, out = [];
    (rows || []).forEach(function (r) {
      if (brand && brandOf(r) !== brand) return;
      var k = norm(r.ma_hang);
      if (!k || seen[k]) return;
      seen[k] = 1;
      out.push(r);
    });
    out.sort(function (a, b) {
      return String(a.ma_hang).localeCompare(String(b.ma_hang));
    });
    return out;
  }

  return {
    norm: norm, stripGlue: stripGlue, upcVariants: upcVariants,
    buildIndexes: buildIndexes, lookup: lookup,
    BRANDS: BRANDS, KHAC: KHAC,
    brandOf: brandOf, brandList: brandList, modelsOfBrand: modelsOfBrand
  };
})();

// app.js dang dung norm() truc tiep
var norm = QK.norm;

</script>
  <script>
/* App quet kho — logic chinh.
 * Luong: setup -> chon che do NHAP/XUAT/KIEMKE -> scan lien tuc
 *   -> tra cuu local mapping -> ghi SCANS len Google Sheet NGAY (queue neu offline).
 * Ma la -> man hinh do, gan tay (hoc ma moi) hoac bo qua.
 * Moi lan quet luu kem gio quet + che do -> doi chieu hang ra/vao tren Sheet.
 */
"use strict";

// ==================== STATE ====================
var LS = {
  nguoi: "qk_nguoi", session: "qk_session", chedo: "qk_chedo",
  thietbi: "qk_thietbi", mappingAdd: "qk_mapping_add", mappingTime: "qk_mapping_time",
  queue: "qk_queue", recent: "qk_recent", counter: "qk_counter_",
  theme: "qk_theme"
};

var MODE_LABEL = { NHAP: "NHẬP", XUAT: "XUẤT", KIEMKE: "KIỂM KÊ" };

var state = {
  nguoi: "", session: "", cheDo: "NHAP", thietbi: "",
  mapping: [],            // [{barcode, ma_hang, ten_hang, loai, hang_sx}]
  idxBarcode: {},         // norm(barcode) -> row
  idxMaHang: {},          // norm(ma_hang) -> row
  recent: [],             // 20 lan quet gan nhat [{id, time, che_do, ma_hang, barcode, trang_thai}]
  lastScan: { code: "", time: 0 },  // chong quet trung 3s
  busyUntil: 0,           // nghi 1.5s sau moi lan quet
  unknownCode: null,      // dang xu ly ma la
  torchOn: false,
  torchSupported: false,
  theme: "auto",          // auto | dark | light
  scanner: null
};

var MAPPING_TTL_MS = 10 * 60 * 1000; // refresh mapping moi 10 phut
var DUP_WINDOW_MS = 3000;            // cung barcode trong 3s -> bo qua
var COOLDOWN_MS = 1500;              // san sang quet tiep sau 1.5s
var RECENT_MAX = 20;

function $(id) { return document.getElementById(id); }
// norm() + lookup() nam trong lookup.js (de test rieng bang test-quet.html)
function fmtTime(d) {
  d = d instanceof Date ? d : new Date(d);
  return String(d.getHours()).padStart(2, "0") + ":" +
    String(d.getMinutes()).padStart(2, "0") + ":" +
    String(d.getSeconds()).padStart(2, "0");
}

var THU_VN = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];

function fmtDate(d) {
  return String(d.getDate()).padStart(2, "0") + "/" +
    String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
}

/* Dong ho ngay gio: gio quet ghi len Sheet lay tu may nay, nen de nguoi quet
 * nhin thay luon — lech gio thi biet ngay ma sua, khong doi den luc doi chieu so. */
function startClock() {
  var tick = function () {
    var d = new Date();
    var t = fmtTime(d), ngay = fmtDate(d);
    var ct = $("clock-time"), cd = $("clock-date"), sc = $("setup-clock");
    if (ct) ct.textContent = t;
    if (cd) cd.textContent = ngay;
    if (sc) sc.textContent = THU_VN[d.getDay()] + " · " + ngay + " · " + t;
  };
  tick();
  setInterval(tick, 1000);
}

// ==================== INIT ====================
document.addEventListener("DOMContentLoaded", function () {
  // thiet_bi fingerprint don gian
  var tb = localStorage.getItem(LS.thietbi);
  if (!tb) {
    tb = "TB_" + Math.random().toString(36).slice(2, 8).toUpperCase();
    localStorage.setItem(LS.thietbi, tb);
  }
  state.thietbi = tb;

  // lich su quet gan day (giu qua reload)
  try { state.recent = JSON.parse(localStorage.getItem(LS.recent) || "[]"); } catch (e) { }

  // dien san form setup
  $("inp-nguoi").value = localStorage.getItem(LS.nguoi) || "";
  var d = new Date();
  var defSession = "PHIEN_" + d.getFullYear() +
    String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  $("inp-session").value = localStorage.getItem(LS.session) || defSession;

  initTheme();

  // che do cuoi cung dang dung
  setMode(localStorage.getItem(LS.chedo) || "NHAP", true);

  startClock();

  $("btn-start").addEventListener("click", startFromSetup);
  $("btn-settings").addEventListener("click", backToSetup);
  $("btn-torch").addEventListener("click", toggleTorch);
  $("btn-cam-retry").addEventListener("click", restartScanner);
  $("btn-close-unknown").addEventListener("click", skipUnknown);
  $("btn-refresh-mapping").addEventListener("click", function () { loadMapping(true); });
  $("btn-summary").addEventListener("click", showSummary);
  $("btn-close-summary").addEventListener("click", function () {
    $("screen-summary").classList.add("hidden");
    $("screen-scan").classList.remove("hidden");
    resumeScanner();
  });
  $("btn-skip-unknown").addEventListener("click", skipUnknown);
  $("inp-search").addEventListener("input", function () { renderSearch(this.value); });

  document.querySelectorAll(".mode-btn").forEach(function (btn) {
    btn.addEventListener("click", function () { setMode(btn.dataset.mode, false); });
  });

  // Chuyen sang app khac roi quay lai: iOS dung camera, quay lai hay bi khung den
  // -> tu bat lai khi man hinh sang tro lai.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if ($("screen-scan").classList.contains("hidden")) return;
    var v = document.querySelector("#reader video");
    if (!state.scanner || !v || v.videoWidth === 0) restartScanner();
  });

  window.addEventListener("online", flushQueue);
  setInterval(flushQueue, 15000);
  setInterval(function () { loadMapping(false); }, 60000); // check TTL moi phut

  renderRecent();

  if (APPS_SCRIPT_URL.indexOf("http") !== 0) {
    $("setup-status").textContent = "⚠ Chưa cấu hình APPS_SCRIPT_URL trong config.js";
  }
});

// ==================== THEME NGAY / DEM ====================
/* 3 nac: AUTO (theo he thong) -> NGAY -> DEM -> AUTO...
 * Trong kho toi thi de DEM cho do choi mat; ra san / ngoai troi nang thi
 * bat NGAY cho nhin ro man hinh duoi nang. */
var THEME_ORDER = ["auto", "light", "dark"];
var THEME_ICON = { auto: "🌗", light: "☀️", dark: "🌙" };
var THEME_LABEL = { auto: "Tự động", light: "Ngày", dark: "Đêm" };

function systemDark() {
  return !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
}

function effectiveTheme() {
  return state.theme === "auto" ? (systemDark() ? "dark" : "light") : state.theme;
}

function applyTheme(theme, silent) {
  state.theme = THEME_ICON[theme] ? theme : "auto";
  localStorage.setItem(LS.theme, state.theme);
  var eff = effectiveTheme();
  document.documentElement.dataset.theme = eff;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", eff === "light" ? "#f2f5f9" : "#0b0f14");
  document.querySelectorAll(".btn-theme").forEach(function (b) {
    b.textContent = THEME_ICON[state.theme];
    b.title = "Giao diện: " + THEME_LABEL[state.theme] + " (chạm để đổi)";
  });
  if (!silent && navigator.vibrate) navigator.vibrate(20);
}

function cycleTheme() {
  var i = THEME_ORDER.indexOf(state.theme);
  applyTheme(THEME_ORDER[(i + 1) % THEME_ORDER.length], false);
}

function initTheme() {
  applyTheme(localStorage.getItem(LS.theme) || "auto", true);
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function () { if (state.theme === "auto") applyTheme("auto", true); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
  document.querySelectorAll(".btn-theme").forEach(function (b) {
    b.addEventListener("click", cycleTheme);
  });
}

// ==================== CHE DO NHAP / XUAT / KIEMKE ====================
function setMode(mode, silent) {
  if (!MODE_LABEL[mode]) mode = "NHAP";
  state.cheDo = mode;
  localStorage.setItem(LS.chedo, mode);
  document.body.dataset.mode = mode; // doi mau chu dao toan man hinh
  document.querySelectorAll(".mode-btn").forEach(function (btn) {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
  if (typeof syncPhieuBar === "function") syncPhieuBar();
  if (!silent && navigator.vibrate) navigator.vibrate(30);
}

function startFromSetup() {
  var nguoi = $("inp-nguoi").value.trim();
  var session = $("inp-session").value.trim();
  if (!nguoi || !session) { alert("Nhập tên người quét và mã phiên."); return; }
  state.nguoi = nguoi; state.session = session;
  localStorage.setItem(LS.nguoi, nguoi);
  localStorage.setItem(LS.session, session);

  $("screen-setup").classList.add("hidden");
  $("screen-scan").classList.remove("hidden");
  $("session-label").textContent = session + " · " + nguoi;
  updateCounter(0);

  // Camera bat NGAY trong cu cham nay — cho loadMapping() xong moi bat thi
  // iPhone coi nhu het quyen tuong tac va tra ve khung den. Mapping tai song song,
  // khong can cho vi danh muc goc da nam san trong app (MAPPING_BASE).
  startScanner();
  loadMapping(false);
}

function backToSetup() {
  stopScanner();
  $("screen-scan").classList.add("hidden");
  $("screen-setup").classList.remove("hidden");
}

// ==================== MAPPING (cache localStorage) ====================
function buildIndexes() {
  var idx = QK.buildIndexes(state.mapping);
  state.idxBarcode = idx.idxBarcode;
  state.idxMaHang = idx.idxMaHang;
}

/* Danh muc may = 2 nguon gop lai:
 *   MAPPING_BASE — 2.650 ma dong goi san trong app (mapping-data.js): mo app la
 *                  co ngay danh sach hang/loai may, khong cho mang, chay duoc offline.
 *   tab MAPPING  — may moi nguoi dung dang ky tren dien thoai. It dong, tai nhanh.
 * Dong tu Sheet dat TRUOC -> buildIndexes giu ban dau tien -> sua tren Sheet thi thang.
 */
function getMappingAdd() {
  try { return JSON.parse(localStorage.getItem(LS.mappingAdd) || "[]"); } catch (e) { return []; }
}

function mergeMapping(added) {
  var base = (typeof MAPPING_BASE !== "undefined" && MAPPING_BASE) ? MAPPING_BASE : [];
  state.mapping = (added || []).concat(base);
  buildIndexes();
  setMappingStatus();
}

function loadMapping(force) {
  if (!state.mapping.length) mergeMapping(getMappingAdd());

  var cachedTime = Number(localStorage.getItem(LS.mappingTime) || 0);
  if (!force && Date.now() - cachedTime < MAPPING_TTL_MS) return Promise.resolve();

  return fetch(APPS_SCRIPT_URL + "?action=getMapping")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error);
      var server = data.rows || [], co = {};
      server.forEach(function (r) { co[QK.norm(r.barcode) + "|" + QK.norm(r.ma_hang)] = 1; });
      // may vua dang ky luc mat mang, chua len duoc Sheet -> giu lai, dung de mat
      var chuaLen = getMappingAdd().filter(function (r) {
        return !co[QK.norm(r.barcode) + "|" + QK.norm(r.ma_hang)];
      });
      var all = server.concat(chuaLen);
      localStorage.setItem(LS.mappingAdd, JSON.stringify(all));
      localStorage.setItem(LS.mappingTime, String(Date.now()));
      mergeMapping(all);
    })
    .catch(function () {
      // mat mang van du dung: danh muc goc nam san trong app
      setMappingStatus();
    });
}

function setMappingStatus() {
  var them = state.mapping.length - ((typeof MAPPING_BASE !== "undefined" && MAPPING_BASE)
    ? MAPPING_BASE.length : 0);
  $("mapping-status").textContent = state.mapping.length + " mã" +
    (them > 0 ? " (+" + them + " mới)" : "");
}

// ==================== TRA CUU (thu tu theo SPEC §3) ====================
function lookup(rawCode) {
  return QK.lookup(rawCode, { idxBarcode: state.idxBarcode, idxMaHang: state.idxMaHang });
}

// ==================== SCANNER ====================
/* iPhone/Safari khac Android o 3 diem, ca 3 deu lam camera "den thui":
 *   1. getUserMedia phai chay NGAY trong cu cham cua nguoi dung — cho fetch xong
 *      moi goi thi Safari coi nhu het quyen tuong tac -> stream co ma khong hien.
 *   2. <video> phai co playsinline + muted + phai goi play() bang tay.
 *   3. html5-qrcode dat width/height px inline vao <video>, tren iOS hay ra 0.
 * startScanner() xu ly ca 3, va co dong ho canh (watchdog): sau 2.5s ma videoWidth
 * van = 0 thi bao ro ly do + nut bat lai, thay vi de nguoi dung nhin o den.
 */
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function scanFormats() {
  return [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.QR_CODE
  ];
}

function camStatus(msg) {
  var box = $("cam-status");
  if (!box) return;
  if (!msg) { box.classList.add("hidden"); return; }
  $("cam-msg").textContent = msg;
  box.classList.remove("hidden");
}

/* Bat buoc video chay inline — thieu cai nay iOS chi hien khung den. */
function hardenVideo() {
  var v = document.querySelector("#reader video");
  if (!v) return null;
  v.setAttribute("playsinline", "true");
  v.setAttribute("webkit-playsinline", "true");
  v.setAttribute("autoplay", "true");
  v.muted = true;
  v.playsInline = true;
  var p = v.play();
  if (p && p.catch) p.catch(function () { });
  return v;
}

/* Sau khi start(): kiem tra co hinh that khong. videoWidth = 0 nghia la
 * stream chua ve duoc khung hinh nao -> bao nguoi dung thay vi de o den. */
function watchVideo() {
  [400, 1200, 2500].forEach(function (ms) {
    setTimeout(function () {
      if (!state.scanner) return;
      var v = hardenVideo();
      if (!v) return;
      if (v.videoWidth > 0) { camStatus(""); return; }
      if (ms === 2500) {
        camStatus("Camera đã bật nhưng chưa lên hình. Thử: đóng hẳn tab rồi mở lại link, " +
          "hoặc kiểm tra app khác (Zalo, FaceTime...) có đang giữ camera không.");
      }
    }, ms);
  });
}

function startScanner() {
  if (state.scanner) return;
  camStatus("Đang bật camera...");
  state.scanner = new Html5Qrcode("reader", { formatsToSupport: scanFormats(), verbose: false });

  // qrbox: thu vien ve 4 mieng che toi quanh khung ngam. Neu kich thuoc khung
  // tinh sai (hay gap tren iOS) thi 4 mieng do phu kin -> dung la "o den".
  //   iOS  : bo han qrbox, quet toan khung hinh — khong con lop che nao de hong.
  //   Khac : qrbox tinh theo khung hinh that, khong dat cung 280x160 (man nho se
  //          bi khung lon hon video -> thu vien bao loi va khong ve gi).
  var cfg = isIOS() ? { fps: 10 } : {
    fps: 10,
    qrbox: function (w, h) {
      var bw = Math.floor(Math.min(w * 0.9, 320));
      var bh = Math.floor(Math.min(h * 0.7, 200));
      return { width: bw, height: bh };
    }
  };

  var onErr = function () { /* khong match frame nay — im lang */ };

  state.scanner.start({ facingMode: "environment" }, cfg, onScan, onErr)
    .then(afterStart)
    .catch(function (e1) {
      // Fallback: vai may (nhat la iPhone cu) tu choi facingMode -> chon camera sau theo deviceId
      Html5Qrcode.getCameras().then(function (cams) {
        if (!cams || !cams.length) throw e1;
        var back = cams.filter(function (c) {
          return /back|rear|sau|environment/i.test(c.label || "");
        })[0] || cams[cams.length - 1];
        return state.scanner.start(back.id, cfg, onScan, onErr).then(afterStart);
      }).catch(function (e2) {
        state.scanner = null;
        camStatus("Không mở được camera: " + (e2 && e2.message ? e2.message : e2) +
          "\nKiểm tra: link phải là https://, và đã bấm Cho phép khi Safari hỏi quyền camera.");
      });
    });
}

function afterStart() {
  camStatus("");
  hardenVideo();
  watchVideo();
  showTorchButton();
}

/* Bat lai camera khi bam nut ↻ (hoac quay lai app sau khi bi treo). */
function restartScanner() {
  stopScanner();
  setTimeout(startScanner, 300);
}

function stopScanner() {
  if (!state.scanner) return;
  var s = state.scanner; state.scanner = null; state.torchOn = false;
  // html5-qrcode nem loi DONG BO khi camera chua chay -> phai bao try, .catch() khong du
  try { var p = s.stop(); if (p && p.catch) p.catch(function () { }); } catch (e) { }
  try { s.clear(); } catch (e) { }   // xoa <video> cu, tranh chong 2 khung khi bat lai
  camStatus("");
  $("btn-torch").classList.add("hidden");
  $("btn-torch").classList.remove("active");
}

function pauseScanner() { try { state.scanner && state.scanner.pause(true); } catch (e) { } }
function resumeScanner() { try { state.scanner && state.scanner.resume(); } catch (e) { } }

// ---- Den flash (cho toi) ----
function getVideoTrack() {
  var video = document.querySelector("#reader video");
  if (!video || !video.srcObject) return null;
  var tracks = video.srcObject.getVideoTracks();
  return tracks.length ? tracks[0] : null;
}

/**
 * Nut den hien khi camera dang chay — TRU iPhone/iPad.
 * WebKit khong cho web bat den flash (khong co constraint 'torch'), nen tren iOS
 * nut nay chac chan bam khong an: an han di cho do vuong mat, thay vi bam vao
 * lai hien bao loi nhu truoc.
 * Android: nhieu may chi bao co torch sau khi camera chay on dinh vai tram ms
 * -> van hien nut roi do lai (probeTorch) thay vi an nham tren may co den that.
 */
function showTorchButton() {
  if (isIOS()) { $("btn-torch").classList.add("hidden"); return; }
  $("btn-torch").classList.remove("hidden");
  probeTorch(0);
  probeTorch(700);
  probeTorch(1800);
}

function probeTorch(delay) {
  setTimeout(function () {
    var track = getVideoTrack();
    if (!track || !track.getCapabilities) return;
    var caps = {};
    try { caps = track.getCapabilities() || {}; } catch (e) { return; }
    if (caps.torch) {
      state.torchSupported = true;
      $("btn-torch").classList.remove("unsupported");
    }
  }, delay);
}

function toggleTorch() {
  var track = getVideoTrack();
  if (!track) { showWarn("Camera chưa chạy — bấm BẮT ĐẦU QUÉT trước."); return; }
  var next = !state.torchOn;
  track.applyConstraints({ advanced: [{ torch: next }] })
    .then(function () {
      state.torchOn = next;
      state.torchSupported = true;
      $("btn-torch").classList.toggle("active", next);
      $("btn-torch").classList.remove("unsupported");
    })
    .catch(function () {
      // May nay khong bat duoc den tu trinh duyet -> an nut luon, bao 1 lan duy nhat.
      state.torchSupported = false;
      $("btn-torch").classList.add("hidden");
      showWarn("Máy này không bật được đèn flash từ trình duyệt — dùng đèn pin rời hoặc kéo thùng ra chỗ sáng.");
    });
}

// ==================== XU LY 1 LAN QUET ====================
// Vai thung (vd Midea) co 2 QR canh nhau: 1 la serial that, 1 la "Scan for Brand
// Claim Info" chi dan toi trang web hang -> phai chan, khong duoc luu nham thanh serial/ma hang.
var URL_QR_RE = /^https?:\/\//i;

function onScan(decodedText) {
  var now = Date.now();
  if (now < state.busyUntil) return;                         // dang cooldown 1.5s
  if (state.unknownCode !== null) return;                    // dang o man hinh ma la
  if (state.pendingDup !== null) return;                     // dang o man hinh serial trung
  var code = decodedText.trim();
  if (!code) return;
  if (URL_QR_RE.test(code)) {
    state.busyUntil = now + COOLDOWN_MS;
    feedback(false);
    showWarn("QR này là link quảng cáo/bảo hành, không phải mã sản phẩm hay serial — quét lại đúng tem mã vạch/serial.");
    return;
  }
  if (code.toUpperCase() === state.lastScan.code && now - state.lastScan.time < DUP_WINDOW_MS) {
    return; // thung nam yen truoc camera -> bo qua
  }
  state.lastScan = { code: code.toUpperCase(), time: now };
  state.busyUntil = now + COOLDOWN_MS;

  // che do SERIAL: ma thung -> chon san pham, ma la -> coi la so serial
  if (state.serialOn) { handleSerialScan(code); return; }

  var row = lookup(code);
  if (row) {
    feedback(true);
    var scan = saveScan(code, row, "OK");
    showResult(row, false, scan);
  } else {
    feedback(false);
    openUnknown(code);
  }
}

function feedback(ok) {
  // beep bang WebAudio + rung
  try {
    var ctx = feedback._ctx || (feedback._ctx = new (window.AudioContext || window.webkitAudioContext)());
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = ok ? 1200 : 300;
    gain.gain.value = 0.3;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + (ok ? 0.12 : 0.4));
  } catch (e) { }
  if (navigator.vibrate) navigator.vibrate(ok ? 100 : [200, 100, 200]);
}

function showResult(row, isManual, scan) {
  var panel = $("result-panel");
  panel.classList.remove("hidden");
  panel.classList.toggle("manual", isManual);
  var lb = $("result-loai");
  lb.textContent = row.loai || "?";
  lb.className = "loai-badge loai-" + (row.loai || "BO");
  $("result-mode").textContent = MODE_LABEL[scan ? scan.che_do : state.cheDo];
  $("result-time").textContent = scan ? fmtTime(scan.timestamp) : fmtTime(new Date());
  $("result-ten").textContent = row.ten_hang || "(không tên)";
  $("result-ma").textContent = row.ma_hang + (isManual ? " · GÁN TAY" : "");
}

var warnTimer = null;
function showWarn(msg) {
  var panel = $("result-panel");
  panel.classList.remove("hidden", "manual");
  panel.classList.add("warn");
  $("result-loai").textContent = "⚠";
  $("result-loai").className = "loai-badge loai-WARN";
  $("result-mode").textContent = "BỎ QUA";
  $("result-time").textContent = fmtTime(new Date());
  $("result-ten").textContent = msg;
  $("result-ma").textContent = "";
  clearTimeout(warnTimer);
  warnTimer = setTimeout(function () { panel.classList.remove("warn"); }, 4000);
}

function updateCounter(delta) {
  var key = LS.counter + state.session;
  var v = Number(localStorage.getItem(key) || 0) + (delta || 0);
  localStorage.setItem(key, String(v));
  $("counter").textContent = v;
}

// ==================== GHI SCAN + OFFLINE QUEUE ====================
function saveScan(barcode, row, trangThai) {
  var scan = {
    id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
    timestamp: new Date().toISOString(),
    che_do: state.cheDo,
    barcode: String(barcode).trim().toUpperCase(),
    ma_hang: row ? row.ma_hang : "",
    ten_hang: row ? row.ten_hang : "",
    loai: row ? row.loai : "",
    thiet_bi: state.thietbi,
    nguoi_quet: state.nguoi,
    session_id: state.session,
    trang_thai: trangThai
  };
  var queue = getQueue();
  queue.push(scan);
  setQueue(queue);
  addRecent(scan);
  updateCounter(1);
  flushQueue(); // day len Sheet NGAY sau moi lan quet
  return scan;
}

function getQueue() {
  try { return JSON.parse(localStorage.getItem(LS.queue) || "[]"); } catch (e) { return []; }
}
function setQueue(q) {
  localStorage.setItem(LS.queue, JSON.stringify(q));
  renderRecent();
}

var flushing = false;
function flushQueue() {
  if (flushing) return;
  var queue = getQueue();
  if (!queue.length) { renderRecent(); return; }
  flushing = true;
  postJSON({ action: "logScan", scans: queue })
    .then(function (res) {
      if (res.ok) {
        // xoa dung so dong da gui (co the co scan moi vao trong luc cho)
        var cur = getQueue();
        setQueue(cur.slice(queue.length));
      }
    })
    .catch(function () { /* offline — giu queue, thu lai sau */ })
    .finally(function () {
      flushing = false; renderRecent();
      if (getQueue().length) setTimeout(flushQueue, 200);
    });
}

function postJSON(body) {
  // Content-Type text/plain de tranh CORS preflight (Apps Script khong ho tro OPTIONS)
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

// ==================== LICH SU GAN DAY + TRANG THAI SYNC ====================
function addRecent(scan) {
  state.recent.unshift({
    id: scan.id, timestamp: scan.timestamp, che_do: scan.che_do,
    ma_hang: scan.ma_hang, barcode: scan.barcode, trang_thai: scan.trang_thai
  });
  if (state.recent.length > RECENT_MAX) state.recent.length = RECENT_MAX;
  localStorage.setItem(LS.recent, JSON.stringify(state.recent));
  renderRecent();
}

function renderRecent() {
  // scan da len Sheet = id khong con trong queue
  var pendingIds = {};
  getQueue().forEach(function (s) { if (s.id) pendingIds[s.id] = true; });
  var nPending = Object.keys(pendingIds).length;

  var st = $("sync-status");
  if (!st) return;
  if (nPending > 0) {
    st.textContent = "⏳ " + nPending + " chờ gửi lên Sheet";
    st.className = "sync-pending";
  } else if (state.recent.length) {
    st.textContent = "✓ Đã lên Sheet lúc " + fmtTime(state.recent[0].timestamp);
    st.className = "sync-ok";
  } else {
    st.textContent = "Chưa quét mã nào";
    st.className = "muted";
  }

  var box = $("recent-list");
  box.innerHTML = "";
  state.recent.slice(0, RECENT_MAX).forEach(function (r) {
    var div = document.createElement("div");
    div.className = "recent-item";
    var maHtml = r.ma_hang
      ? escapeHtml(r.ma_hang)
      : "<span class='unk'>MÃ LẠ: " + escapeHtml(r.barcode) + "</span>";
    div.innerHTML =
      "<span class='recent-time'>" + fmtTime(r.timestamp) + "</span>" +
      "<span class='recent-mode m-" + r.che_do + "'>" + (MODE_LABEL[r.che_do] || r.che_do) + "</span>" +
      "<span class='recent-ma'>" + maHtml + "</span>" +
      "<span class='recent-sync'>" + (pendingIds[r.id] ? "⏳" : "✓") + "</span>";
    box.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// ==================== UNKNOWN FLOW (hoc ma moi) ====================
function openUnknown(code) {
  state.unknownCode = code;
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  $("screen-unknown").classList.remove("hidden");
  $("unknown-barcode").textContent = code;
  $("inp-search").value = "";
  renderSearch("");
}

function closeUnknown() {
  state.unknownCode = null;
  $("screen-unknown").classList.add("hidden");
  $("screen-scan").classList.remove("hidden");
  state.busyUntil = Date.now() + COOLDOWN_MS;
  resumeScanner();
}

function skipUnknown() {
  saveScan(state.unknownCode, null, "UNKNOWN");
  closeUnknown();
}

// fuzzy CHI de goi y trong man gan tay (khong bao gio tu gan)
function renderSearch(q) {
  var box = $("search-results");
  var nq = norm(q);
  if (nq.length < 2) { box.innerHTML = "<p class='muted'>Gõ ít nhất 2 ký tự...</p>"; return; }
  var results = [];
  for (var i = 0; i < state.mapping.length && results.length < 20; i++) {
    var r = state.mapping[i];
    if (norm(r.ma_hang).indexOf(nq) >= 0 || norm(r.ten_hang).indexOf(nq) >= 0) {
      results.push(r);
    }
  }
  if (!results.length) { box.innerHTML = "<p class='muted'>Không tìm thấy.</p>"; return; }
  box.innerHTML = "";
  results.forEach(function (r) {
    var div = document.createElement("div");
    div.className = "search-item";
    div.innerHTML = "<div class='si-ma'>" + escapeHtml(r.ma_hang) + " <span class='loai-badge loai-" + (r.loai || "BO") +
      "' style='font-size:12px;padding:2px 6px'>" + r.loai + "</span></div>" +
      "<div class='si-ten'>" + escapeHtml(r.ten_hang) + "</div>";
    div.addEventListener("click", function () { assignUnknown(r); });
    box.appendChild(div);
  });
}

function assignUnknown(row) {
  var code = state.unknownCode;
  if (!confirm("Gán mã lạ\n" + code + "\n→ " + row.ma_hang + " (" + row.ten_hang + ")?")) return;

  // 1. them vao mapping local ngay -> lan quet sau nhan lien (ke ca dang offline)
  var newRow = { barcode: code.toUpperCase(), ma_hang: row.ma_hang, ten_hang: row.ten_hang, loai: row.loai, hang_sx: row.hang_sx };
  addModelLocal(newRow);

  // 2. ghi MAPPING tren server
  postJSON({
    action: "addMapping", barcode: code, ma_hang: row.ma_hang,
    ten_hang: row.ten_hang, loai: row.loai, hang_sx: row.hang_sx, nguoi: state.nguoi
  }).catch(function () { alert("⚠ Chưa gửi được mapping mới lên server (mất mạng?). Mã vẫn dùng được trên máy này."); });

  // 3. ghi SCAN trang_thai=MANUAL
  var scan = saveScan(code, newRow, "MANUAL");
  feedback(true);
  closeUnknown();
  showResult(newRow, true, scan);
}

// ==================== SUMMARY ====================
function showSummary() {
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  $("screen-summary").classList.remove("hidden");
  var el = $("summary-content");
  el.textContent = "Đang tải...";
  fetch(APPS_SCRIPT_URL + "?action=getSummary&session_id=" + encodeURIComponent(state.session))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error);
      var bm = data.byMode || {};
      var html = "<p>Phiên <b>" + escapeHtml(data.session_id) + "</b>: tổng <b>" + data.total + "</b> lượt" +
        " (<span class='col-nhap'>" + (bm.NHAP || 0) + " nhập</span>, " +
        "<span class='col-xuat'>" + (bm.XUAT || 0) + " xuất</span>, " +
        "<span class='col-kk'>" + (bm.KIEMKE || 0) + " kiểm kê</span>), " +
        "<b>" + data.unknown + "</b> mã lạ chưa xử lý.</p>" +
        "<table><tr><th>Mã hàng</th><th>Nhập</th><th>Xuất</th><th>KK</th></tr>";
      data.items.forEach(function (it) {
        html += "<tr><td>" + (escapeHtml(it.ma_hang) || "(mã lạ)") + "<br><span class='muted'>" +
          escapeHtml(it.ten_hang) + "</span></td>" +
          "<td class='col-nhap'>" + (it.NHAP || "") + "</td>" +
          "<td class='col-xuat'>" + (it.XUAT || "") + "</td>" +
          "<td class='col-kk'>" + (it.KIEMKE || "") + "</td></tr>";
      });
      el.innerHTML = html + "</table>";
    })
    .catch(function (e) { el.textContent = "Không tải được: " + e.message; });
}

/* =========================================================================
 * CHE DO QUET SO SERIAL
 * -------------------------------------------------------------------------
 * Luong: bat SERIAL -> quet ma thung/ma hang 1 lan (chon san pham)
 *        -> quet lien tuc cac so serial cua san pham do, moi serial 1 dong.
 * Serial trung (da nhap / da xuat / da dem trong phien) -> man hinh do.
 * Moi dong len tab SERIAL, tab QUET_TONKHO tu cong don bang cong thuc.
 * ========================================================================= */

LS.serialOn = "qk_serial_on";
LS.squeue = "qk_squeue";
LS.sidx = "qk_sidx";
LS.sidxTime = "qk_sidx_time";

state.serialOn = false;
state.serialModel = null;   // row mapping dang gan serial vao
state.serialIdx = {};       // {SERIAL: {m: che_do, s: session}} — check trung offline
state.serialCount = {};     // dem serial trong phien theo ma_hang
state.pendingDup = null;    // serial dang cho xac nhan o man hinh trung

var SIDX_TTL_MS = 5 * 60 * 1000;

document.addEventListener("DOMContentLoaded", function () {
  $("btn-serial-toggle").addEventListener("click", function () { setSerialMode(!state.serialOn); });
  $("btn-serial-add").addEventListener("click", addSerialManual);
  $("inp-serial").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addSerialManual(); }
  });
  $("btn-dup-skip").addEventListener("click", function () { closeDup(false); });
  $("btn-close-dup").addEventListener("click", function () { closeDup(false); });
  $("btn-dup-force").addEventListener("click", function () { closeDup(true); });
  $("btn-tonkho").addEventListener("click", showTonKho);

  try { state.serialIdx = JSON.parse(localStorage.getItem(LS.sidx) || "{}"); } catch (e) { }
  setSerialMode(localStorage.getItem(LS.serialOn) === "1", true);

  setInterval(flushSerialQueue, 15000);
  window.addEventListener("online", flushSerialQueue);
});

function setSerialMode(on, silent) {
  state.serialOn = !!on;
  localStorage.setItem(LS.serialOn, on ? "1" : "0");
  document.body.classList.toggle("serial-on", state.serialOn);
  $("btn-serial-toggle").textContent = "🔢 SERIAL: " + (state.serialOn ? "BẬT" : "TẮT");
  $("btn-serial-toggle").classList.toggle("active", state.serialOn);
  $("serial-manual").classList.toggle("hidden", !state.serialOn);
  if (!state.serialOn) {
    state.serialModel = null;
    $("serial-model").textContent = "Bật để quét số serial";
    $("serial-model").className = "serial-model muted";
  } else {
    renderSerialModel();
    loadSerialIndex(false);
    // bat SERIAL ma chua chon may -> hoi hang ngay, giong may kiem hang cu
    if (!silent && !state.serialModel && typeof openHang === "function") openHang();
  }
  if (typeof syncPhieuBar === "function") syncPhieuBar();
  if (!silent && navigator.vibrate) navigator.vibrate(30);
}

function renderSerialModel() {
  var el = $("serial-model");
  if (!state.serialModel) {
    el.textContent = "⬅ Bấm 🏷 Chọn máy";
    el.className = "serial-model waiting";
    return;
  }
  var ma = state.serialModel.ma_hang;
  var hang = QK.brandOf(state.serialModel);
  el.textContent = (hang && hang !== QK.KHAC ? hang + " · " : "") + ma +
    " · " + (state.serialCount[ma] || 0) + " serial";
  el.className = "serial-model ready";
}

/** Tai index serial tu Sheet -> check trung ngay ca khi mat mang. */
function loadSerialIndex(force) {
  var t = Number(localStorage.getItem(LS.sidxTime) || 0);
  if (!force && Date.now() - t < SIDX_TTL_MS) return Promise.resolve();
  return fetch(APPS_SCRIPT_URL + "?action=getSerialIndex")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error(d.error);
      state.serialIdx = d.map || {};
      localStorage.setItem(LS.sidx, JSON.stringify(state.serialIdx));
      localStorage.setItem(LS.sidxTime, String(Date.now()));
    })
    .catch(function () { /* offline — dung index cu */ });
}

/** Serial nay co bi trung theo che do hien tai khong? */
function dupReason(serial) {
  var prev = state.serialIdx[serial];
  // Serial chua tung quet NHAP: luc moi trien khai thi HAU HET serial deu vay
  // (hang cu da nam trong kho tu truoc). Mac dinh CHO QUA, chi ghi chu trang thai.
  // Bat CHAN_XUAT_KHONG_TON = true trong config.js khi da quet nhap day du.
  if (state.cheDo === "XUAT" && !prev) {
    return (typeof CHAN_XUAT_KHONG_TON !== "undefined" && CHAN_XUAT_KHONG_TON)
      ? "Serial này chưa từng nhập kho — không có tồn để xuất."
      : null;
  }
  if (!prev) return null;
  if (state.cheDo === "NHAP" && prev.m === "NHAP") return "Serial này đã được NHẬP trước đó, chưa xuất.";
  if (state.cheDo === "XUAT" && prev.m === "XUAT") return "Serial này đã được XUẤT trước đó.";
  if (state.cheDo === "KIEMKE" && prev.m === "KIEMKE" && prev.s === state.session)
    return "Serial này đã đếm trong phiên " + state.session + ".";
  return null;
}

/** Xu ly 1 ma trong che do SERIAL. */
function handleSerialScan(code) {
  var row = lookup(code);
  if (row) {                      // ma thung / ma hang -> chon san pham
    state.serialModel = row;
    feedback(true);
    renderSerialModel();
    showResult(row, false, null);
    return;
  }
  if (!state.serialModel) {       // chua chon san pham -> nhac chon truoc
    feedback(false);
    $("serial-model").textContent = (state.cheDo === "XUAT" && state.phieuSel)
      ? "⚠ Chạm vào dòng hàng trong phiếu trước"
      : "⚠ Bấm 🏷 Chọn máy trước, rồi mới quét serial";
    $("serial-model").className = "serial-model waiting";
    return;
  }
  submitSerial(code, false);
}

function submitSerial(rawSerial, force) {
  var serial = String(rawSerial).trim().toUpperCase();
  if (!serial) return;
  if (!force) {
    var why = dupReason(serial);
    if (why) { feedback(false); openDup(serial, why); return; }
  }
  feedback(true);
  var tt = force ? "GHI_DE" : "OK";
  if (state.cheDo === "XUAT" && !state.serialIdx[serial]) tt = "CHUA_QUA_NHAP";
  saveSerial(serial, tt);
}

function saveSerial(serial, trangThai) {
  var row = state.serialModel || {};
  var scan = {
    id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
    timestamp: new Date().toISOString(),
    che_do: state.cheDo,
    serial: serial,
    ma_hang: row.ma_hang || "",
    ten_hang: row.ten_hang || "",
    kho: "",
    nguoi_quet: state.nguoi,
    thiet_bi: state.thietbi,
    session_id: state.session,
    trang_thai: trangThai,
    so_phieu: state.cheDo === "XUAT" ? (state.phieuSel || "") : ""
  };
  var q = getSerialQueue(); q.push(scan); setSerialQueue(q);

  // cap nhat index local ngay -> quet lai serial nay lien la bao trung
  state.serialIdx[serial] = { m: state.cheDo, s: state.session };
  localStorage.setItem(LS.sidx, JSON.stringify(state.serialIdx));

  var ma = scan.ma_hang || "(chưa gán)";
  state.serialCount[ma] = (state.serialCount[ma] || 0) + 1;
  if (scan.so_phieu) {
    var pk = scan.so_phieu + "|" + scan.ma_hang;
    state.phieuDone[pk] = (state.phieuDone[pk] || 0) + 1;
  }

  addRecent({
    id: scan.id, timestamp: scan.timestamp, che_do: scan.che_do,
    ma_hang: scan.ma_hang + " · " + serial, barcode: serial, trang_thai: trangThai
  });
  updateCounter(1);
  renderSerialModel();
  if (typeof renderPhieuLines === "function") renderPhieuLines();
  flushSerialQueue();
}

function addSerialManual() {
  var inp = $("inp-serial");
  var v = inp.value.trim();
  if (!v) return;
  if (!state.serialModel) { alert("Bấm 🏷 Chọn máy để chọn hãng + loại máy trước."); return; }
  submitSerial(v, false);
  inp.value = "";
  inp.focus();
}

// ---- Man hinh serial trung ----
function openDup(serial, why) {
  state.pendingDup = serial;
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  $("screen-dup").classList.remove("hidden");
  $("dup-serial").textContent = serial;
  $("dup-reason").textContent = why;
}

function closeDup(force) {
  var serial = state.pendingDup;
  state.pendingDup = null;
  $("screen-dup").classList.add("hidden");
  $("screen-scan").classList.remove("hidden");
  state.busyUntil = Date.now() + COOLDOWN_MS;
  resumeScanner();
  if (force && serial) saveSerial(serial, "GHI_DE");
}

// ---- Queue rieng cho serial ----
function getSerialQueue() {
  try { return JSON.parse(localStorage.getItem(LS.squeue) || "[]"); } catch (e) { return []; }
}
function setSerialQueue(q) {
  localStorage.setItem(LS.squeue, JSON.stringify(q));
  renderRecent();
}

var sFlushing = false;
function flushSerialQueue() {
  if (sFlushing) return;
  var q = getSerialQueue();
  if (!q.length) return;
  sFlushing = true;
  postJSON({ action: "logSerial", scans: q })
    .then(function (res) {
      if (!res.ok) return;
      setSerialQueue(getSerialQueue().slice(q.length));
      // lay lai cot THUC XUAT tu Sheet -> tien do tren dien thoai khop voi Sheet
      if (state.phieuSel) setTimeout(function () { loadPhieu(true); }, 1500);
      if (res.dup && res.dup.length) {
        // server phat hien trung ma dien thoai chua biet (may khac vua quet)
        $("sync-status").textContent = "⚠ " + res.dup.length + " serial trùng — xem tab SERIAL";
        $("sync-status").className = "sync-pending";
        loadSerialIndex(true);
      }
    })
    .catch(function () { })
    .finally(function () {
      sFlushing = false; renderRecent();
      // quet nhanh -> co scan moi vao trong luc dang gui -> day tiep ngay
      if (getSerialQueue().length) setTimeout(flushSerialQueue, 200);
    });
}

// ---- Doi chieu ton he thong vs serial da quet ----
function showTonKho() {
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  $("screen-summary").classList.remove("hidden");
  var el = $("summary-content");
  el.textContent = "Đang tải tồn kho...";
  fetch(APPS_SCRIPT_URL + "?action=getTonKho")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error(d.error);
      var html = "<p>Đối chiếu <b>tồn trên Sheet</b> với <b>serial đã quét trong phiên</b>:</p>" +
        "<table><tr><th>Mã hàng</th><th>Sheet</th><th>Quét</th><th>Lệch</th></tr>";
      var rows = d.rows.filter(function (r) { return state.serialCount[r.ma_hang] || r.ton; });
      rows.sort(function (a, b) {
        return Math.abs((state.serialCount[b.ma_hang] || 0) - b.ton) -
          Math.abs((state.serialCount[a.ma_hang] || 0) - a.ton);
      });
      rows.slice(0, 100).forEach(function (r) {
        var q = state.serialCount[r.ma_hang] || 0;
        var lech = q - r.ton;
        html += "<tr><td>" + escapeHtml(r.ma_hang) + "<br><span class='muted'>" +
          escapeHtml(r.ten_hang) + "</span></td><td>" + r.ton + "</td><td>" + q + "</td>" +
          "<td class='" + (lech === 0 ? "col-kk" : "col-xuat") + "'>" +
          (lech > 0 ? "+" : "") + lech + "</td></tr>";
      });
      el.innerHTML = html + "</table>";
    })
    .catch(function (e) { el.textContent = "Không tải được: " + e.message; });
}

/* =========================================================================
 * XUAT HANG THEO PHIEU  (tab TIEN DO XUAT HANG)
 * -------------------------------------------------------------------------
 * Ra kho xuat hang: chon phieu -> cham vao dong hang -> quet serial tung may.
 * Cot THUC XUAT tren Sheet tu nhay theo so serial da quet dung phieu + dung ma.
 * ========================================================================= */

LS.phieu = "qk_phieu";
LS.phieuTime = "qk_phieu_time";

state.phieuAll = [];      // toan bo dong phieu tu Sheet
state.phieuSel = "";      // so phieu dang chon
state.phieuLines = [];    // cac dong hang cua phieu do
state.phieuDone = {};     // "phieu|ma_hang" -> so serial da quet trong phien nay
state.phieuBase = {};     // "phieu|ma_hang" -> so THUC XUAT tren Sheet luc bat dau

var PHIEU_TTL_MS = 3 * 60 * 1000;

document.addEventListener("DOMContentLoaded", function () {
  $("btn-phieu").addEventListener("click", openPhieu);
  $("btn-close-phieu").addEventListener("click", closePhieu);
  $("inp-phieu-search").addEventListener("input", function () { renderPhieuList(this.value); });
  try { state.phieuAll = JSON.parse(localStorage.getItem(LS.phieu) || "[]"); } catch (e) { }
  syncPhieuBar();
});

/** Thanh chon phieu chi hien khi: che do XUAT + dang bat SERIAL. */
function syncPhieuBar() {
  var show = state.serialOn && state.cheDo === "XUAT";
  var bar = $("phieu-bar"), lines = $("phieu-lines");
  if (!bar) return;
  bar.classList.toggle("hidden", !show);
  lines.classList.toggle("hidden", !show || !state.phieuSel);
  if (show) { loadPhieu(false); renderPhieuLines(); }
}

function loadPhieu(force) {
  var t = Number(localStorage.getItem(LS.phieuTime) || 0);
  if (!force && state.phieuAll.length && Date.now() - t < PHIEU_TTL_MS) return Promise.resolve();
  return fetch(APPS_SCRIPT_URL + "?action=getPhieu")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error(d.error);
      state.phieuAll = d.rows || [];
      localStorage.setItem(LS.phieu, JSON.stringify(state.phieuAll));
      localStorage.setItem(LS.phieuTime, String(Date.now()));
      if (state.phieuSel) selectPhieu(state.phieuSel, true);
    })
    .catch(function () { /* offline — dung danh sach cu */ });
}

function openPhieu() {
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  $("screen-phieu").classList.remove("hidden");
  $("inp-phieu-search").value = "";
  renderPhieuList("");
  loadPhieu(true).then(function () { renderPhieuList($("inp-phieu-search").value); });
}

function closePhieu() {
  $("screen-phieu").classList.add("hidden");
  $("screen-scan").classList.remove("hidden");
  state.busyUntil = Date.now() + COOLDOWN_MS;
  resumeScanner();
}

function renderPhieuList(q) {
  var box = $("phieu-results");
  var nq = norm(q);
  // gom theo so phieu
  var byPhieu = {};
  state.phieuAll.forEach(function (r) {
    if (nq && norm(r.phieu).indexOf(nq) < 0 && norm(r.khach).indexOf(nq) < 0 &&
      norm(r.ma_hang).indexOf(nq) < 0) return;
    if (!byPhieu[r.phieu]) byPhieu[r.phieu] = { phieu: r.phieu, khach: r.khach, lines: [], sl: 0 };
    byPhieu[r.phieu].lines.push(r);
    byPhieu[r.phieu].sl += r.sl;
  });
  var list = Object.keys(byPhieu).map(function (k) { return byPhieu[k]; });
  if (!list.length) {
    box.innerHTML = "<p class='muted'>" +
      (state.phieuAll.length ? "Không tìm thấy phiếu." : "Chưa tải được danh sách phiếu.") + "</p>";
    return;
  }
  box.innerHTML = "";
  list.slice(0, 60).forEach(function (p) {
    var div = document.createElement("div");
    div.className = "search-item";
    div.innerHTML = "<div class='si-ma'>" + escapeHtml(p.phieu) +
      " <span class='muted'>· " + p.lines.length + " dòng · " + p.sl + " máy</span></div>" +
      "<div class='si-ten'>" + escapeHtml(p.khach) + "</div>";
    div.addEventListener("click", function () { selectPhieu(p.phieu, false); closePhieu(); });
    box.appendChild(div);
  });
}

function selectPhieu(phieu, silent) {
  state.phieuSel = phieu;
  state.phieuLines = state.phieuAll.filter(function (r) { return r.phieu === phieu; });
  state.serialModel = null;
  // phieu chi co 1 ma hang -> chon luon, khoi cham
  if (state.phieuLines.length === 1) setLineModel(state.phieuLines[0]);
  $("phieu-label").textContent = phieu + " · " + (state.phieuLines[0] || {}).khach;
  $("phieu-label").className = "phieu-label";
  $("phieu-lines").classList.remove("hidden");
  renderPhieuLines();
  if (!silent && navigator.vibrate) navigator.vibrate(30);
}

function setLineModel(line) {
  state.serialModel = {
    barcode: "", ma_hang: line.ma_hang, ten_hang: line.ten_hang, loai: "", hang_sx: ""
  };
  renderSerialModel();
  renderPhieuLines();
}

/**
 * So serial da quet cho 1 dong phieu =
 *   so tren Sheet (cot THUC XUAT, nguon chuan)  +  so con nam trong hang doi chua gui.
 * Nho vay khong bi dem 2 lan sau khi dong bo, va van dung khi dang mat mang.
 */
function phieuScanned(line) {
  var key = state.phieuSel + "|" + line.ma_hang;
  var sheet = Number(line.thuc_xuat) || 0;
  // mocs: so tren Sheet luc dau tien nhin thay dong nay trong phien nay
  if (state.phieuBase[key] === undefined) state.phieuBase[key] = sheet;
  var tuQuet = state.phieuBase[key] + (state.phieuDone[key] || 0);
  // Sheet cao hon -> may khac cung dang quet phieu nay, lay so lon hon
  return Math.max(sheet, tuQuet);
}

function renderPhieuLines() {
  var box = $("phieu-lines");
  if (!box || !state.phieuSel) return;
  box.innerHTML = "";
  state.phieuLines.forEach(function (line) {
    var done = phieuScanned(line);
    var sel = state.serialModel && state.serialModel.ma_hang === line.ma_hang;
    var div = document.createElement("div");
    div.className = "phieu-line" + (sel ? " sel" : "") + (done >= line.sl ? " done" : "");
    div.innerHTML = "<span class='pl-ma'>" + escapeHtml(line.ma_hang) + "</span>" +
      "<span class='pl-ten'>" + escapeHtml(line.ten_hang) + "</span>" +
      "<span class='pl-num'>" + done + "/" + line.sl + "</span>";
    div.addEventListener("click", function () { setLineModel(line); });
    box.appendChild(div);
  });
}

/* =========================================================================
 * CHON MAY: HANG -> LOAI MAY  (lam giong may kiem hang cu)
 * -------------------------------------------------------------------------
 * May cu: dang ky hang -> bam loai may -> bam scan -> doc serial.
 * O day cung vay: 🏷 Chon may -> chon hang -> chon model -> quet serial lien tuc.
 * May chua co trong danh sach thi dang ky ngay tren dien thoai (them vao MAPPING).
 * ========================================================================= */

LS.hang = "qk_hang";

state.hangSel = "";        // hang dang chon
state.modelBack = "";      // man hinh quay ve sau khi chon xong

document.addEventListener("DOMContentLoaded", function () {
  $("btn-chon-may").addEventListener("click", openHang);
  $("btn-close-hang").addEventListener("click", closeChonMay);
  $("btn-close-model").addEventListener("click", closeChonMay);
  $("btn-back-hang").addEventListener("click", openHang);
  $("inp-hang-search").addEventListener("input", function () { renderHangGrid(this.value); });
  $("inp-model-search").addEventListener("input", function () { renderModelList(this.value); });
  $("btn-may-moi").addEventListener("click", openMayMoi);
  $("btn-nm-cancel").addEventListener("click", function () { openModel(state.hangSel); });
  $("btn-nm-save").addEventListener("click", saveMayMoi);
  state.hangSel = localStorage.getItem(LS.hang) || "";
});

function hideAllPickers() {
  $("screen-hang").classList.add("hidden");
  $("screen-model").classList.add("hidden");
  $("screen-newmodel").classList.add("hidden");
}

/** Man hinh 1: chon hang. */
function openHang() {
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  hideAllPickers();
  $("screen-hang").classList.remove("hidden");
  $("inp-hang-search").value = "";
  renderHangGrid("");
  // mapping co the chua tai xong luc bat app -> tai roi ve lai
  loadMapping(false).then(function () {
    if (!$("screen-hang").classList.contains("hidden")) {
      renderHangGrid($("inp-hang-search").value);
    }
  });
}

function renderHangGrid(q) {
  var box = $("hang-grid");
  box.innerHTML = "";
  if (!state.mapping.length) {
    box.innerHTML = "<p class='muted'>Chưa tải được danh sách máy. " +
      "Kiểm tra mạng rồi bấm ↻ Mapping.</p>";
    return;
  }
  var kw = String(q || "").trim().toUpperCase();
  var list = QK.brandList(state.mapping).filter(function (b) {
    return !kw || b.hang.indexOf(kw) >= 0;
  });
  if (!list.length) { box.innerHTML = "<p class='muted'>Không có hãng nào khớp.</p>"; return; }
  list.forEach(function (b) {
    var el = document.createElement("button");
    el.className = "hang-btn" + (b.hang === state.hangSel ? " active" : "");
    el.innerHTML = "<span class='hang-ten'>" + escapeHtml(b.hang) + "</span>" +
      "<span class='hang-num'>" + b.count + " máy</span>";
    el.addEventListener("click", function () { openModel(b.hang); });
    box.appendChild(el);
  });
}

/** Man hinh 2: chon loai may cua hang do. */
function openModel(hang) {
  state.hangSel = hang || "";
  localStorage.setItem(LS.hang, state.hangSel);
  pauseScanner();
  $("screen-scan").classList.add("hidden");
  hideAllPickers();
  $("screen-model").classList.remove("hidden");
  $("model-title").textContent = "Chọn loại máy — " + (state.hangSel || "tất cả");
  $("inp-model-search").value = "";
  renderModelList("");
}

function renderModelList(q) {
  var box = $("model-results");
  box.innerHTML = "";
  var kw = QK.norm(q);
  var rows = QK.modelsOfBrand(state.mapping, state.hangSel);
  var timCaKho = false;
  if (kw) {
    var loc = function (list) {
      return list.filter(function (r) {
        return QK.norm(r.ma_hang).indexOf(kw) >= 0 || QK.norm(r.ten_hang).indexOf(kw) >= 0;
      });
    };
    rows = loc(rows);
    // khong thay trong hang dang chon -> tim ca kho, tranh bat nguoi dung doan hang
    if (!rows.length) {
      rows = loc(QK.modelsOfBrand(state.mapping, ""));
      timCaKho = rows.length > 0;
    }
  }
  if (!rows.length) {
    box.innerHTML = "<p class='muted'>Không có máy nào khớp. " +
      "Máy mới thì bấm <b>➕ Máy mới</b> bên dưới.</p>";
    return;
  }
  if (timCaKho) {
    var note = document.createElement("p");
    note.className = "muted";
    note.textContent = "Không có trong " + state.hangSel + " — đang tìm cả kho:";
    box.appendChild(note);
  }
  rows.slice(0, 300).forEach(function (r) {
    var div = document.createElement("div");
    div.className = "model-item";
    div.innerHTML = "<span class='loai-badge loai-" + escapeHtml(r.loai || "BO") + "'>" +
      escapeHtml(r.loai || "?") + "</span>" +
      "<span class='model-ma'>" + escapeHtml(r.ma_hang) + "</span>" +
      "<span class='model-ten'>" + escapeHtml(r.ten_hang || "") + "</span>";
    div.addEventListener("click", function () { chonModel(r); });
    box.appendChild(div);
  });
  if (rows.length > 300) {
    var p = document.createElement("p");
    p.className = "muted";
    p.textContent = "… còn " + (rows.length - 300) + " máy nữa — gõ thêm để lọc.";
    box.appendChild(p);
  }
}

/** Chon xong 1 model -> bat SERIAL va quet lien tuc. */
function chonModel(row) {
  state.serialModel = row;
  hideAllPickers();
  $("screen-scan").classList.remove("hidden");
  if (!state.serialOn) setSerialMode(true, true);
  renderSerialModel();
  showResult(row, false, null);
  state.busyUntil = Date.now() + COOLDOWN_MS;
  resumeScanner();
  if (navigator.vibrate) navigator.vibrate(30);
}

function closeChonMay() {
  hideAllPickers();
  $("screen-scan").classList.remove("hidden");
  state.busyUntil = Date.now() + COOLDOWN_MS;
  resumeScanner();
}

/* ---- Dang ky may moi ngay tren dien thoai ---- */
function openMayMoi() {
  hideAllPickers();
  $("screen-newmodel").classList.remove("hidden");
  $("inp-nm-hang").value = (state.hangSel && state.hangSel !== QK.KHAC) ? state.hangSel : "";
  $("inp-nm-ma").value = "";
  $("inp-nm-ten").value = "";
  $("inp-nm-barcode").value = "";
  $("nm-status").textContent = "";
  $("inp-nm-ma").focus();
}

function saveMayMoi() {
  var hang = $("inp-nm-hang").value.trim().toUpperCase();
  var ma = $("inp-nm-ma").value.trim().toUpperCase();
  var ten = $("inp-nm-ten").value.trim();
  var loai = $("inp-nm-loai").value;
  var barcode = $("inp-nm-barcode").value.trim().toUpperCase();

  if (!ma) { $("nm-status").textContent = "⚠ Phải có mã hàng (model)."; return; }
  if (!ten) ten = (hang ? hang + " " : "") + ma;
  // khong co ma vach thi lay chinh ma hang lam khoa -> quet thung in model van nhan
  if (!barcode) barcode = ma;

  var row = {
    barcode: barcode, ma_hang: ma, ten_hang: ten, loai: loai, hang_sx: hang
  };

  $("nm-status").textContent = "Đang lưu...";
  postJSON({
    action: "addMapping", barcode: barcode, ma_hang: ma, ten_hang: ten,
    loai: loai, hang_sx: hang, nguoi: state.nguoi
  }).then(function (res) {
    if (!res || !res.ok) throw new Error((res && res.error) || "lỗi");
    // dung dong server tra ve (truong hop barcode da ton tai voi ma khac)
    var saved = res.row || row;
    addModelLocal(saved);
    $("nm-status").textContent = res.existed ? "Mã này đã có sẵn — dùng luôn." : "";
    chonModel(saved);
  }).catch(function (e) {
    // mat mang van cho quet tiep: luu tam trong may, lan sau co mang dang ky lai
    addModelLocal(row);
    $("nm-status").textContent = "⚠ Chưa lưu được lên Sheet (mất mạng) — " +
      "vẫn quét được, nhớ đăng ký lại khi có mạng.";
    chonModel(row);
  });
}

/** Them model vao danh muc trong may -> chon/tim thay ngay, ke ca dang mat mang.
 *  Chi luu phan "them moi" vao localStorage; 2.650 ma goc da nam san trong app. */
function addModelLocal(row) {
  var kb = QK.norm(row.barcode), km = QK.norm(row.ma_hang);
  var added = getMappingAdd();
  var da = added.some(function (r) {
    return QK.norm(r.barcode) === kb && QK.norm(r.ma_hang) === km;
  });
  if (!da) added.unshift(row);
  try { localStorage.setItem(LS.mappingAdd, JSON.stringify(added)); } catch (e) { }
  mergeMapping(added);
}

</script>
