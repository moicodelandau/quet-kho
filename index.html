<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Quét kho</title>
  <style>
/* Giao dien toi uu cho dien thoai cam 1 tay trong kho.
 * Mau chu dao doi theo che do: NHAP=xanh la, XUAT=cam do, KIEMKE=xanh duong.
 * Chi doi CSS — moi id/class giu nguyen de app.js khong doi.
 */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* ===== THEME =====
 * Mac dinh: DEM (kho thuong thieu sang, do choi mat).
 * data-theme="light" tren <html>: NGAY — nhin ro khi ra san / ngoai nang.
 * Nut 🌗 doi 3 nac: Tu dong (theo may) -> Ngay -> Dem.
 */
:root {
  --c-nhap: #22c55e;
  --c-xuat: #f97316;
  --c-kiemke: #38bdf8;
  --c-serial: #eab308;
  --bg: #0b0f14;
  --card: #151b23;
  --card2: #1c2430;
  --border: #2a3441;
  --text: #e8eef5;
  --muted: #8b98a8;
  --danger: #ff6b6b;
  --on-accent: #0b0f14;       /* chu nam TREN nen mau chu dao */
  --btn-gray: #3a4552;
  --btn-gray-text: #fff;
  --code-bg: #000;
  --unknown-bg: linear-gradient(180deg, #3a0d0d, #1a0808);
  --card-shadow: 0 12px 40px rgba(0, 0, 0, .45);
  --radius: 14px;
}

:root[data-theme="light"] {
  --c-nhap: #16a34a;
  --c-xuat: #ea580c;
  --c-kiemke: #0284c7;
  --c-serial: #ca8a04;
  --bg: #f2f5f9;
  --card: #ffffff;
  --card2: #eef2f7;
  --border: #cdd7e3;
  --text: #16202b;
  --muted: #5d6b7c;
  --danger: #dc2626;
  --on-accent: #ffffff;
  --btn-gray: #d7dee7;
  --btn-gray-text: #16202b;
  --code-bg: #fff;
  --unknown-bg: linear-gradient(180deg, #ffe4e4, #fff5f5);
  --card-shadow: 0 10px 30px rgba(19, 39, 61, .12);
}
body[data-mode="NHAP"]   { --accent: var(--c-nhap);   --accent-dim: rgba(34,197,94,.16); }
body[data-mode="XUAT"]   { --accent: var(--c-xuat);   --accent-dim: rgba(249,115,22,.16); }
body[data-mode="KIEMKE"] { --accent: var(--c-kiemke); --accent-dim: rgba(56,189,248,.16); }

html, body { height: 100%; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  overscroll-behavior: none;
}
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
button { font-family: inherit; touch-action: manipulation; }

.screen {
  padding: 10px;
  padding-top: calc(10px + env(safe-area-inset-top));
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  max-width: 520px; margin: 0 auto;
}
.screen h2 { margin: 8px 0 16px; }

/* ===== dau man hinh phu: tieu de + nut dong LUON o tren cung, trong tam ngon tay ===== */
.sheet-head {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin: -10px -10px 12px;
  padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.sheet-head h2 { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 19px; }
.btn-close-x {
  flex: 0 0 auto;
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--btn-gray); color: var(--btn-gray-text);
  border: 1px solid var(--border);
  font-size: 20px; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.btn-close-x:active { transform: scale(.94); }

/* ===== dong ho ngay gio ===== */
.clock {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  line-height: 1.15; font-variant-numeric: tabular-nums;
}
.clock b { font-size: 15px; font-weight: 700; }
.clock i { font-style: normal; font-size: 11px; color: var(--muted); }
.setup-clock {
  text-align: center; color: var(--muted); font-size: 14px;
  margin: -14px 0 20px; font-variant-numeric: tabular-nums;
}

/* ===== 1. man setup ===== */
#screen-setup { display: flex; align-items: center; min-height: 100dvh; }
.setup-card {
  width: 100%;
  background: linear-gradient(180deg, var(--card2), var(--card));
  border: 1px solid var(--border);
  border-radius: 20px; padding: 26px 22px;
  box-shadow: var(--card-shadow);
  position: relative;
}
.setup-theme { position: absolute; top: 14px; right: 14px; }
.setup-card h2 { text-align: center; font-size: 26px; margin-bottom: 22px; }
label { display: block; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
input[type=text] {
  width: 100%; padding: 14px; margin-top: 6px;
  font-size: 18px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
}
input[type=text]:focus { outline: 2px solid var(--c-nhap); border-color: transparent; }

.btn-big {
  width: 100%; padding: 17px; margin-top: 12px;
  font-size: 18px; font-weight: 700; border: none; border-radius: 14px;
  cursor: pointer;
}
.btn-big:active { transform: scale(.98); }
.btn-green { background: var(--c-nhap); color: #04220f; box-shadow: 0 6px 20px rgba(34,197,94,.35); }
.btn-gray { background: var(--btn-gray); color: var(--btn-gray-text); }

/* ===== 2. man scan: layout doc kin man hinh ===== */
.scan-layout {
  display: flex; flex-direction: column; gap: 8px;
  height: 100dvh; overflow: hidden;
}

.topbar { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
#counter {
  background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 20px;
  min-width: 52px; text-align: center; padding: 7px 12px; border-radius: 12px;
  font-variant-numeric: tabular-nums;
  transition: background .25s;
}
#session-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.btn-icon {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
  font-size: 18px; width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* thanh chon che do — segmented control */
.mode-bar {
  display: flex; gap: 5px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 5px;
}
.mode-btn {
  flex: 1; padding: 13px 2px; font-size: 15px; font-weight: 700;
  border: none; border-radius: 10px; background: transparent;
  color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s;
}
.mode-btn.active.mode-NHAP   { background: var(--c-nhap);   color: #04220f; }
.mode-btn.active.mode-XUAT   { background: var(--c-xuat);   color: #2a1000; }
.mode-btn.active.mode-KIEMKE { background: var(--c-kiemke); color: #04222f; }

/* camera + nut den flash noi tren camera */
#reader-wrap {
  position: relative; flex: 0 0 auto;
  border-radius: var(--radius); overflow: hidden; background: #000;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px var(--accent-dim);
  transition: border-color .25s, box-shadow .25s;
  min-height: 200px;
}
#reader { width: 100%; min-height: 200px; }
/* html5-qrcode dat width/height bang px inline vao <video> — tren iPhone con so do
 * hay ra 0 hoac lech khung -> chi thay o den. Ep lai bang CSS de video luon phu khung. */
#reader video {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  max-height: 46dvh;
  object-fit: cover;
  background: #000;
}
#reader img { display: none; }        /* anh placeholder cua thu vien */
#reader > div:first-child { border: none !important; }

/* bao loi / huong dan khi camera khong len hinh */
.cam-status {
  position: absolute; inset: 0; z-index: 6;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 18px; text-align: center;
  background: rgba(11, 15, 20, .93); color: #fff;
}
.cam-status p { font-size: 14px; line-height: 1.45; }
.torch-fab {
  position: absolute; right: 10px; bottom: 10px; z-index: 5;
  width: 54px; height: 54px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.25); font-size: 24px;
  background: rgba(11, 15, 20, .78); color: #fff;
  backdrop-filter: blur(4px);
}
.torch-fab.active { background: #f1c40f; border-color: #f1c40f; color: #2a1f00; }
/* may khong bat duoc den tu trinh duyet (hay gap o iPhone) — van hien de bam biet ly do */
.torch-fab.unsupported { opacity: .45; }

/* the ket qua quet gan nhat */
.result {
  padding: 13px 14px; border-radius: var(--radius);
  background: linear-gradient(180deg, var(--card2), var(--card));
  border: 1px solid var(--border);
  border-left: 6px solid var(--accent);
}
.result.manual { border-left-color: #f1c40f; }
.result.warn { border-left-color: var(--danger); }
.loai-WARN { background: var(--danger); color: #fff; }
.result-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.loai-badge {
  display: inline-block; padding: 3px 13px; border-radius: 8px;
  font-weight: 800; font-size: 18px;
}
.loai-DL { background: #2f81f7; color: #fff; }
.loai-DN { background: #e67e22; color: #fff; }
.loai-BO { background: #7f8c8d; color: #fff; }
.mode-chip {
  font-size: 12px; font-weight: 700; color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid var(--accent); border-radius: 7px; padding: 3px 9px;
}
.result-time { margin-left: auto; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result-ten { font-size: 20px; font-weight: 700; line-height: 1.25; }
.result-ma { font-size: 15px; color: var(--muted); margin-top: 3px; }

/* trang thai sync + lich su quet gan day */
.recent-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 13px; padding: 0 2px;
}
.sync-ok { color: var(--c-nhap); font-weight: 700; }
.sync-pending { color: var(--c-xuat); font-weight: 700; }

#recent-list { flex: 1 1 0; overflow-y: auto; min-height: 40px; }
.recent-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 11px; margin-bottom: 5px;
  background: var(--card); border: 1px solid var(--border); border-radius: 11px;
  font-size: 14px;
}
.recent-time { color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; font-size: 13px; }
.recent-mode { font-weight: 700; font-size: 12px; flex-shrink: 0; width: 58px; }
.recent-mode.m-NHAP   { color: var(--c-nhap); }
.recent-mode.m-XUAT   { color: var(--c-xuat); }
.recent-mode.m-KIEMKE { color: var(--c-kiemke); }
.recent-ma { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.recent-ma .unk { color: var(--danger); }
.recent-sync { flex-shrink: 0; font-size: 13px; }

.toolbar { display: flex; gap: 8px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
.btn-tool {
  flex: 1; padding: 12px 4px; font-size: 14px; font-weight: 600; border-radius: 12px;
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  cursor: pointer;
}
.btn-tool:active { background: var(--card2); }

/* ===== 3. man ma la ===== */
.unknown-bg { background: var(--unknown-bg); min-height: 100dvh; }
.unknown-bg h2 { color: var(--danger); }
.unknown-code {
  font-size: 26px; font-weight: 800; word-break: break-all;
  background: var(--code-bg); padding: 14px; border-radius: 12px; margin-bottom: 14px;
  color: var(--danger); text-align: center;
  border: 1px dashed var(--danger);
}
#screen-unknown input[type=text]:focus { outline-color: var(--danger); }
#search-results { margin-top: 10px; max-height: 45vh; overflow-y: auto; }
.search-item {
  padding: 13px; background: var(--card); border: 1px solid var(--border);
  cursor: pointer; border-radius: 11px; margin-bottom: 6px;
}
.search-item:active { background: var(--card2); }
.search-item .si-ma { font-weight: 700; font-size: 16px; }
.search-item .si-ten { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ===== tong ket ===== */
#summary-content table { width: 100%; border-collapse: collapse; font-size: 14px; }
#summary-content td, #summary-content th {
  padding: 9px 5px; border-bottom: 1px solid var(--border); text-align: left;
}
#summary-content th:not(:first-child), #summary-content td:not(:first-child) {
  text-align: right;
}
#summary-content .col-nhap { color: var(--c-nhap); font-weight: 700; }
#summary-content .col-xuat { color: var(--c-xuat); font-weight: 700; }
#summary-content .col-kk   { color: var(--c-kiemke); font-weight: 700; }

/* ==================== CHE DO QUET SERIAL ==================== */
.serial-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
}

.serial-toggle {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .3px;
}

.serial-toggle.active {
  border-color: var(--c-serial);
  background: var(--c-serial);
  color: #3a2a00;
}

.serial-model {
  flex: 1 1 auto;
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.serial-model.waiting { color: var(--c-serial); }
.serial-model.ready   { color: var(--c-nhap); }

/* vien vang quanh camera khi dang o che do serial — nhin liec la biet */
body.serial-on #reader-wrap {
  outline: 3px solid var(--c-serial);
  outline-offset: -3px;
}

.serial-manual {
  display: flex;
  gap: 8px;
  padding: 6px 10px;
}

.serial-manual input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;          /* >=16px de iOS khong tu zoom khi focus */
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .5px;
}

.serial-manual input:focus {
  outline: none;
  border-color: var(--c-serial);
}

.serial-manual .btn-tool { flex: 0 0 auto; }

.btn-red {
  background: var(--danger);
  color: #fff;
}

/* ==================== XUAT HANG THEO PHIEU ==================== */
.phieu-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 6px;
}

.phieu-label {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--c-xuat);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.phieu-lines {
  padding: 0 10px 6px;
  max-height: 132px;
  overflow-y: auto;
}

.phieu-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  margin-bottom: 4px;
  border: 2px solid var(--border);
  border-left-width: 5px;
  border-radius: 10px;
  background: var(--card);
}

.phieu-line.sel {
  border-color: var(--c-xuat);
  background: var(--accent-dim);
}

.phieu-line.done {
  border-left-color: var(--c-nhap);
}

.pl-ma {
  flex: 0 0 auto;
  font-weight: 800;
  font-size: 14px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

.pl-ten {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pl-num {
  flex: 0 0 auto;
  font-weight: 800;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}

.phieu-line.done .pl-num { color: var(--c-nhap); }

#screen-phieu input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
}

#screen-phieu input:focus { outline: none; border-color: var(--c-xuat); }

#phieu-results {
  flex: 1 1 auto;
  overflow-y: auto;
  margin-bottom: 10px;
}

/* ===== CHON MAY: hang -> loai may =====
 * Nut to, chia 2 cot: cam dien thoai 1 tay trong kho van bam trung.
 * Man hinh cao bang man dien thoai: danh sach cuon o giua, nut hanh dong
 * (➕ May moi / Doi hang / Dong) luon dinh o duoi, khong phai cuon het 300 dong moi thay.
 */
#screen-hang, #screen-model {
  display: flex; flex-direction: column;
  height: 100dvh; max-height: 100dvh;
}
#screen-hang.hidden, #screen-model.hidden { display: none !important; }
#screen-hang h2, #screen-model h2,
#screen-hang input, #screen-model input,
#screen-hang .btn-big, #screen-model .btn-big { flex: 0 0 auto; }
/* trong cac man hinh flex-column, dau man hinh khong duoc co lai */
.sheet-head { flex: 0 0 auto; }
/* rule '#screen-hang h2 {flex:0 0 auto}' o tren manh hon .sheet-head h2 ->
 * tieu de khong gian ra, nut ✕ dinh sat chu thay vi nam mep phai. Ghi de lai. */
#screen-hang .sheet-head h2,
#screen-model .sheet-head h2 { flex: 1 1 auto; }

#screen-hang input[type=text], #screen-model input[type=text],
#screen-newmodel input[type=text], #screen-newmodel select {
  width: 100%; padding: 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 16px; margin-bottom: 10px;
}
#screen-hang input:focus, #screen-model input:focus,
#screen-newmodel input:focus { outline: none; border-color: var(--accent); }

.hang-grid {
  flex: 1 1 auto; overflow-y: auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  align-content: start; margin-bottom: 10px;
}
.hang-btn {
  display: flex; flex-direction: column; gap: 3px;
  padding: 16px 10px; border-radius: 12px; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  text-align: left; font-family: inherit;
}
.hang-btn:active { background: var(--card2); }
.hang-btn.active { border-color: var(--accent); background: var(--card2); }
.hang-btn .hang-ten { font-weight: 700; font-size: 16px; }
.hang-btn .hang-num { font-size: 12px; color: var(--muted); }

#model-results { flex: 1 1 auto; overflow-y: auto; margin-bottom: 10px; }
.model-item {
  display: grid; grid-template-columns: auto 1fr; gap: 3px 9px;
  align-items: center; padding: 12px 13px; margin-bottom: 6px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 11px; cursor: pointer;
}
.model-item:active { background: var(--card2); }
.model-item .model-ma { font-weight: 700; font-size: 16px; }
.model-item .model-ten {
  grid-column: 2; font-size: 13px; color: var(--muted); line-height: 1.35;
}

#screen-newmodel label { display: block; margin-bottom: 4px; font-size: 14px; }
#screen-newmodel { overflow-y: auto; }
#nm-status { margin-top: 10px; text-align: center; }

</style>
  <script>
    // Dat theme TRUOC khi ve man hinh -> khong bi nhay den->sang luc mo app
    (function () {
      try {
        var t = localStorage.getItem("qk_theme") || "auto";
        if (t === "auto") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
            ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body data-mode="NHAP">

  <!-- ===== 1. SETUP (lan dau) ===== -->
  <div id="screen-setup" class="screen">
    <div class="setup-card">
      <button class="btn-theme btn-icon setup-theme" type="button" title="Đổi giao diện">🌗</button>
      <h2>📦 Quét kho</h2>
      <p id="setup-clock" class="setup-clock"></p>
      <label>Tên người quét
        <input id="inp-nguoi" type="text" placeholder="VD: Hải" autocomplete="off">
      </label>
      <label>Mã phiên (mặc định theo ngày)
        <input id="inp-session" type="text" autocomplete="off">
      </label>
      <button id="btn-start" class="btn-big btn-green">BẮT ĐẦU QUÉT</button>
      <p id="setup-status" class="muted"></p>
    </div>
  </div>

  <!-- ===== 2. SCAN (chinh) ===== -->
  <div id="screen-scan" class="screen scan-layout hidden">

    <div class="topbar">
      <span id="counter" title="Số lần quét trong phiên">0</span>
      <span id="clock" class="clock" title="Ngày giờ hiện tại">
        <b id="clock-time">--:--:--</b><i id="clock-date"></i>
      </span>
      <span id="session-label" class="muted"></span>
      <button class="btn-theme btn-icon" type="button" title="Đổi giao diện">🌗</button>
      <button id="btn-settings" class="btn-icon" title="Đổi phiên / người">⚙</button>
    </div>

    <!-- chon che do: moi lan quet ghi kem che do nay -->
